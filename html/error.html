<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Authentication Error</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #23ccffc0, #ffdcdc);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background: white;
            padding: 30px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(27, 57, 255, 0.3);
            animation: pop 0.4s ease;
        }

        @keyframes pop {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        h1 {
            color: #001e80;
            margin-bottom: 10px;
            font-size: 24px;
        }

        p {
            font-size: 16px;
            color: #333;
            margin-bottom: 25px;
        }

        a {
            display: inline-block;
            padding: 12px 25px;
            background: #010352;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            transition: 0.3s;
            font-size: 16px;
        }

        a:hover {
            background: #0e003f;
        }

        .icon {
            font-size: 60px;
            color: #0076d6;
            margin-bottom: 15px;
        }

        @media (max-width: 350px) {
            .container {
                padding: 22px;
            }

            h1 {
                font-size: 20px;
            }

            p {
                font-size: 14px;
            }

            a {
                padding: 10px 18px;
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

<div class="container">
    <div class="icon">⚠️</div>
    <h1>Access Denied</h1>
    <p>Authentication failed or page not found.</p>

    <!-- FIXED BUTTON -->
    <a href="/login.html">Login Again</a>
</div>

</body>
</html>
