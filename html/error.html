<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Authentication Error</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #23ccffc0, #ffdcdc);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .container {
            background: white;
            padding: 40px;
            width: 380px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(27, 57, 255, 0.3);
            animation: pop 0.4s ease;
        }

        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        h1 {
            color: #001e80;
            margin-bottom: 10px;
        }

        p {
            font-size: 16px;
            color: #333;
            margin-bottom: 25px;
        }

        a {
            display: inline-block;
            padding: 12px 25px;
            background: #010352;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            transition: 0.3s;
        }

        a:hover {
            background: #0e003f;
        }

        .icon {
            font-size: 60px;
            color: #0076d6;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="icon">⚠️</div>
    <h1>Access Denied</h1>
    <p>404 error.... This page doesn't exist.</p>

    <a href="/register.html">Login Again</a>
</div>

</body>
</html>
